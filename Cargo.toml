[package]
name = "mosox"
license = "MIT"
authors = ["Chris Arderne <chris@rdrn.me"]
description = "LP matrix generator for GMPL"
version = "0.0.999"  # set by Github Actions CI
edition = "2024"
repository = "https://github.com/carderne/mosox"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
highs = "2.0.0"
indexmap = "2.12.1"
itertools = "0.14.0"
lasso = { version = "0.7.3", features = ["multi-threaded"] }
pest = "2.8.3"
pest_derive = "2.8.3"
rayon = "1.11.0"
smallvec = "1.15.1"

[lib]
name = "mosox"

[[bin]]
name = "mosox"
path = "src/main.rs"

[profile.release]
debug = true

# These add about a 5-10% speedup
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "2.1"
